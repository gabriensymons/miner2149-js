<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A browser-based reimplementation of Michael Baker's Miner2149 for Palm OS.">
    <title>Miner2149 JS</title>

    <!-- Scripts -->
    <script src="/scripts/vendor/pixi.min.js"></script>

    <!-- Favicon -->
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">

    <!-- CSS -->
    <link rel="stylesheet" media="screen" href="/styles/style.css">
</head>

<body>
    <div>
        <label for="zoom">Zoom Level <span id="zoom-output">1</span></label>
        <br>
        <input name="zoom" id="zoom" type="range" min="1" max="20" value="1" class="zoom-slider">
    </div>
    <div id="user-section">
    </div>
    <script type="module" src="scripts/app.js"></script>
    <script src="scripts/zoom.js"></script>
</body>

</html>
